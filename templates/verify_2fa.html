{% extends "base.html" %}

{% block title %}Verify 2FA - Flask 2FA App{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <h2>🔒 Two-Factor Authentication</h2>
        <p class="subtitle">Enter the 6-digit code from your authenticator app</p>
        
        <form method="POST" action="{{ url_for('verify_2fa') }}">
            <div class="form-group">
                <label for="token">Authentication Code</label>
                <input type="text" id="token" name="token" required 
                       placeholder="000000" maxlength="6" pattern="[0-9]{6}" 
                       autocomplete="off" autofocus class="token-input">
                <small>Enter the 6-digit code from your authenticator app</small>
            </div>
            
            <button type="submit" class="btn btn-primary">Verify</button>
        </form>
        
        <p class="auth-link">
            <a href="{{ url_for('login') }}">← Back to Login</a>
        </p>
    </div>
</div>

<script>
    // Auto-submit when 6 digits are entered
    document.getElementById('token').addEventListener('input', function(e) {
        if (e.target.value.length === 6) {
            e.target.form.submit();
        }
    });
</script>
{% endblock %}
